<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ferretech | Herramientas y materiales de construcción</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles/styles.css">
</head>

<body>

    <header class="header">
        <div class="header__fila">
            <a href="index.html" class="header__marca">
                <span class="header__logo">FERRE<span class="header__logo-acento">TECH</span></span>
                <span class="header__eslogan">Herramientas &amp; construcción</span>
            </a>
        </div>

        <div class="franja-peligro" aria-hidden="true"></div>
    </header>

    <main>
        <section class="contenedor">
            <div>
                <h2>INGRESE NOMBRE DE USUARIO y CONTRASEÑA</h2>
            </div>
            <div class="buscador-usuario">
                <input type="text" id="usuario-input" placeholder="INGRESE USUARIO">
            </div>
            <div class="buscador-contraseña">
                <input type="text" id="contrasena-input" placeholder="INGRESE CONTRASEÑA">
            </div>
            <div>
                <button class="btn-usuario" id="btn-crear">
                    Crear usuario
                </button>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="franja-peligro" aria-hidden="true"></div>
        <div class="footer__contenido">

            <span class="footer__lado">Horario
                <p>1</p>
            </span>

            <div class="footer__marca">
                <span class="header__logo footer__logo">FERRE<span class="header__logo-acento">TECH</span></span>
                <p>Curso de Desarrollo Web · Proyecto Ferretech</p>
            </div>

            <span class="footer__lado">Ubicación
                <p>1</p>
            </span>
        </div>
    </footer>

    <script src = "js/login.js"></script>

</body>
</html>
